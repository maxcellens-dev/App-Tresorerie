<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Relyka — Pilote ta trésorerie personnelle</title>

    <!-- PWA -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Équivalent standard : sans lui, Chrome déprécie la balise `apple-` ci-dessus. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Relyka" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!--
      SEO de BASE (statique). Indispensable : les robots qui n'exécutent PAS de JavaScript
      (Facebook, LinkedIn, WhatsApp, Slack, Discord…) ne voient que ce fichier. Le SEO Center
      (components/SeoHead → lib/seo.ts) n'applique ses valeurs qu'au runtime, donc après leur passage.

      `data-seo="1"` est OBLIGATOIRE : `upsertMeta()` ne retrouve que les balises ainsi marquées et
      les met à jour EN PLACE. Sans ce marqueur, le runtime en créerait un second exemplaire.

      Les valeurs ci-dessous recopient SEO_DEFAULTS (lib/seo.ts) : les garder synchronisées.
    -->
    <meta name="description" data-seo="1" content="Relyka t'aide à piloter ta trésorerie au quotidien : reste à vivre, projections, épargne et investissement, en toute sérénité." />
    <meta name="theme-color" data-seo="1" content="#0D2E2A" />
    <link rel="canonical" data-seo="1" href="https://relyka.app" />

    <meta property="og:type" data-seo="1" content="website" />
    <meta property="og:site_name" data-seo="1" content="Relyka" />
    <meta property="og:title" data-seo="1" content="Relyka — Pilote ta trésorerie personnelle" />
    <meta property="og:description" data-seo="1" content="Relyka t'aide à piloter ta trésorerie au quotidien : reste à vivre, projections, épargne et investissement, en toute sérénité." />
    <meta property="og:url" data-seo="1" content="https://relyka.app" />
    <!-- Repli : pas d'image sociale dédiée (SEO_DEFAULTS.ogImage est vide) → le logo carré. Une image
         1200×630 paramétrée dans l'admin la remplacera au runtime, mais PAS pour ces robots-là. -->
    <meta property="og:image" data-seo="1" content="https://relyka.app/icon-512.png" />
    <meta property="og:image:alt" data-seo="1" content="Relyka — pilote ta trésorerie" />
    <meta name="twitter:card" data-seo="1" content="summary_large_image" />

    <!--
      NOM DU SITE dans Google (la ligne « Relyka » au-dessus de l'URL, à la place de « relyka.app »).

      Google le choisit à partir de la page d'ACCUEIL uniquement, et privilégie les données
      structurées `WebSite` ; `og:site_name`, `<title>` et `application-name` ne sont que des
      signaux secondaires. Ce bloc doit donc être SERVI DANS LE HTML : le SEO Center l'injecte déjà
      au runtime (lib/seo.ts → buildJsonLd), mais après le passage des robots qui n'exécutent pas
      de JS. `data-seo="1"` permet à l'injection runtime de le REMPLACER au lieu d'en créer un second.

      ⚠️ Google met plusieurs jours à plusieurs semaines à reprendre un nom de site.
      Les valeurs recopient SEO_DEFAULTS (lib/seo.ts) : les garder synchronisées.
    -->
    <meta name="application-name" content="Relyka" />
    <script type="application/ld+json" data-seo="1">
      [
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "Relyka",
          "url": "https://relyka.app",
          "logo": "https://relyka.app/icon-512.png"
        },
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "Relyka",
          "url": "https://relyka.app"
        }
      ]
    </script>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!--
      FOCUS — l'anneau natif du navigateur reprend la couleur d'accent du SYSTÈME (orange sur
      beaucoup de Windows/Android) : il jure avec la charte et il encadre la boîte au lieu de
      l'habiter. On le neutralise ; chaque champ signale lui-même sa saisie (bordure d'accent +
      fond teinté sur toute sa surface, cf. les styles `*Focus` des écrans).
      Les éléments cliquables gardent un repère clavier, mais aux couleurs de l'app.
    -->
    <style id="focus-reset">
      input, textarea, select, [contenteditable] { outline: none !important; }
      input:focus, input:focus-visible,
      textarea:focus, textarea:focus-visible,
      select:focus, select:focus-visible,
      [contenteditable]:focus, [contenteditable]:focus-visible {
        outline: none !important;
        box-shadow: none;
      }
      /* Souris/tactile : aucun contour sur les boutons et liens. */
      button:focus:not(:focus-visible),
      a:focus:not(:focus-visible),
      [role="button"]:focus:not(:focus-visible),
      div[tabindex]:focus:not(:focus-visible) { outline: none !important; }
      /* Navigation clavier : repère discret, à la couleur d'accent (émeraude). */
      button:focus-visible,
      a:focus-visible,
      [role="button"]:focus-visible,
      div[tabindex]:focus-visible {
        outline: 2px solid rgba(0, 182, 122, 0.75) !important;
        outline-offset: 2px;
      }
      /* Autofill Chrome : plus de rectangle bleu/jaune imposé par le navigateur. */
      input:-webkit-autofill,
      input:-webkit-autofill:focus {
        -webkit-box-shadow: 0 0 0 1000px transparent inset;
        transition: background-color 9999s ease-in-out 0s;
      }
    </style>

    <!--
      BUREAU (>= 1024 px) — finitions « site web » que React Native Web ne sait pas exprimer :
      curseur souris, ascenseurs discrets, sélection de texte, rendu de police.
      Tout est enfermé dans une media query : sur téléphone et tablette, rien ne s'applique et
      l'app garde son comportement tactile à l'identique.
    -->
    <style id="desktop-web">
      @media (min-width: 1024px) {
        /* Un site se lit et se copie : on rend le texte sélectionnable (RNW le bloque par défaut). */
        body { -webkit-user-select: text; user-select: text; }
        /* …sauf sur les éléments d'interface, où la sélection au clic est parasite. */
        [role="button"], [role="link"], [role="tab"], button, nav { -webkit-user-select: none; user-select: none; }

        /* Curseur : indispensable pour que l'interface réponde comme un site. */
        [role="button"], [role="link"], button, a, [role="tab"], summary { cursor: pointer; }
        [role="button"][aria-disabled="true"], button[disabled] { cursor: not-allowed; }
        input, textarea, [contenteditable] { cursor: text; }

        /* Ascenseurs fins et neutres (Firefox + WebKit), au lieu des barres système épaisses. */
        * { scrollbar-width: thin; scrollbar-color: rgba(140,140,140,.38) transparent; }

        /*
          ASCENSEURS RENDUS À L'ORDINATEUR.

          Les écrans sont écrits pour le mobile, où l'on fait défiler au doigt : ils passent donc
          presque tous `showsVerticalScrollIndicator={false}` (et l'équivalent horizontal). React
          Native Web traduit ça par `scrollbar-width: none` — sur un navigateur, la page défilait
          sans qu'AUCUNE barre ne dise qu'il y a quelque chose plus bas, et les rangées horizontales
          (liste des comptes dans les filtres, à la saisie d'une transaction, au choix du compte de
          prélèvement d'un crédit) n'étaient plus atteignables du tout : pas de barre, et pas de
          glissement au doigt non plus.

          On rétablit donc les ascenseurs sur ordinateur uniquement. `!important` est nécessaire :
          on écrase une classe générée par la bibliothèque, plus spécifique que nos sélecteurs.
          `auto` reste la règle → la barre n'apparaît que si le contenu déborde réellement.
        */
        *, *::before, *::after { scrollbar-width: thin !important; }
        ::-webkit-scrollbar { width: 11px; height: 11px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
          background: rgba(140,140,140,.32);
          border-radius: 999px;
          border: 3px solid transparent;
          background-clip: content-box;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(140,140,140,.55); background-clip: content-box; }
        ::-webkit-scrollbar-corner { background: transparent; }

        /* Texte : lissage et ligatures — un écran d'ordinateur montre tout. */
        body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }

        /*
          SURVOL — piloté par l'attribut `data-hover`, posé côté React via les helpers
          `hoverRow` / `hoverCard` / `hoverTint` de lib/webLayout. Ce détour par le CSS évite de
          remplacer les TouchableOpacity par des Pressable : le retour TACTILE de l'app mobile
          reste rigoureusement identique, seul le navigateur d'ordinateur ajoute le survol.
        */
        [data-hover] { transition: background-color .15s ease, box-shadow .18s ease, transform .18s ease, border-color .15s ease; }
        [data-hover="row"]:hover  { background-color: rgba(128,128,128,.10); }
        [data-hover="tint"]:hover { filter: brightness(1.08); }
        [data-hover="card"]:hover {
          transform: translateY(-2px);
          box-shadow: 0 10px 24px rgba(0,0,0,.16), 0 2px 6px rgba(0,0,0,.10);
        }
        [data-hover]:active { transform: none; }
      }
      /* Sélection aux couleurs de la marque, quelle que soit la largeur. */
      ::selection { background: rgba(0, 182, 122, 0.26); }
    </style>

    <!--
      Écran de chargement (avant le montage de React) — évite l'écran blanc.
      LOGO SEUL, identique à components/AppLoading (même image `icon-512.png`, qui est aussi le logo
      du splash natif ; le favicon est une AUTRE image). Sortie calquée sur le splash natif :
      fondu du calque + logo qui file vers le haut.
      NB : `app/+html.tsx` n'est PAS utilisé ici — avec `web.output: "single"` (app.json), Expo prend
      CE fichier comme coquille. Toute modification du chargement web doit se faire ici.
    -->
    <style id="boot-loader">
      #app-boot {
        position: fixed; inset: 0; z-index: 99999; background: var(--boot-bg, #808F88);
        display: flex; align-items: center; justify-content: center;
        transition: opacity .34s ease-in;
      }
      #app-boot .boot-logo {
        width: 96px; height: 96px;
        background: url('/icon-512.png') center / contain no-repeat;
        transition: transform .34s cubic-bezier(.4, 0, 1, 1);
      }
      #app-boot.boot-out { opacity: 0; }
      #app-boot.boot-out .boot-logo { transform: translateY(-64px); }
      @media (prefers-reduced-motion: reduce) {
        #app-boot .boot-logo { transition: none; }
        #app-boot.boot-out .boot-logo { transform: none; }
      }
    </style>
    <script>
      // Applique le dernier thème connu AVANT la première peinture (clés alignées sur lib/themeBoot).
      // Priorité au thème UTILISATEUR, repli sur le thème ADMIN, puis couleur neutre (1ʳᵉ visite).
      (function () {
        function mode() {
          try {
            var u = localStorage.getItem('relyka.user.theme');
            if (u) { var m = JSON.parse(u).mode; if (m === 'light' || m === 'dark') return m; }
          } catch (e) {}
          try {
            var a = localStorage.getItem('relyka.admin.theme');
            if (a === 'light' || a === 'dark') return a;
          } catch (e) {}
          return null;
        }
        try {
          var m = mode();
          var bg = m === 'light' ? '#F4EFE6' : m === 'dark' ? '#0D2E2A' : '#808F88';
          document.documentElement.style.setProperty('--boot-bg', bg);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="app-boot"><div class="boot-logo"></div></div>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <script>
      // Retire le calque quand la VRAIE app est peinte. Pas « dès que React a monté » : React monte
      // souvent sur AppLoading, qui affiche le MÊME logo au même endroit — sortir là ferait glisser
      // un logo par-dessus un logo immobile. On attend donc la disparition de [data-app-loading].
      (function () {
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          var el = document.getElementById('app-boot');
          if (!el) return;
          el.className = 'boot-out';
          setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 400);
        }
        function painted(root) {
          return root.childNodes.length > 0 && !root.querySelector('[data-app-loading]');
        }
        function start() {
          var root = document.getElementById('root');
          if (!root) { window.addEventListener('load', function () { setTimeout(hide, 300); }); return; }
          if (painted(root)) { setTimeout(hide, 150); return; }
          var obs = new MutationObserver(function () {
            if (painted(root)) { obs.disconnect(); setTimeout(hide, 150); }
          });
          obs.observe(root, { childList: true, subtree: true });
          setTimeout(hide, 8000); // filet de sécurité : ne jamais rester bloqué sur le logo
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
        else start();
      })();
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
